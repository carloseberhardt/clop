[package]
name = "clop"
version = "0.1.0"
edition = "2024"
rust-version = "1.89"
description = "A btop-style dashboard for Claude Code sessions: activity, processes, program counts, and what they left behind"
license = "MIT"
repository = "https://github.com/carloseberhardt/clop"
readme = "README.md"

[dependencies]
anyhow = "1.0.104"
chrono = { version = "0.4.45", default-features = false, features = ["clock", "std"] }
dirs = "7.0.0"
libc = "0.2.191"
ratatui = "0.30.2"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
toml = "1.2.0"

[profile.release]
lto = true
codegen-units = 1
strip = true
